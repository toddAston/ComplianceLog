name: server-image

# Builds, scans, and (conditionally) publishes the API container image.
# Triggers only on changes under server/ so it never blocks unrelated client work.
# The push step runs ONLY when a registry secret is configured, so a fresh fork
# with no secrets still gets build + scan coverage without failing on push.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/domain/**"
      - "src/application/**"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/domain/**"
      - "src/application/**"

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from server/package.json
        id: meta
        run: echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: |
            fieldlog-api:${{ github.sha }}
            fieldlog-api:${{ steps.meta.outputs.version }}

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fieldlog-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Check registry credentials
        id: regcheck
        run: |
          if [ -n "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No REGISTRY_TOKEN secret set — skipping push (build + scan only)."
          fi

      - name: Log in to registry
        if: steps.regcheck.outputs.enabled == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Push image (scan passed, credentials present, push event only)
        if: steps.regcheck.outputs.enabled == 'true' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_HOST }}/fieldlog-api:${{ github.sha }}
            ${{ vars.REGISTRY_HOST }}/fieldlog-api:${{ steps.meta.outputs.version }}
